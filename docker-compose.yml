services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: repull
      POSTGRES_PASSWORD: repull
      POSTGRES_DB: repull_rev
    ports:
      - '5433:5432'
    volumes:
      - repull_rev_pgdata:/var/lib/postgresql/data

volumes:
  repull_rev_pgdata:
